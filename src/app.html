<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<script>
			// Gespeichertes Farbschema und Akzentfarbe sofort setzen, damit die Seite nicht kurz aufblitzt.
			try {
				const theme = localStorage.getItem('fh-theme');
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
				const accent = localStorage.getItem('fh-accent');
				if (accent === 'indigo' || accent === 'graphit')
					document.documentElement.dataset.accent = accent;
			} catch {
				// Speicher nicht verfügbar (z. B. privater Modus): Systemeinstellung gilt.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
